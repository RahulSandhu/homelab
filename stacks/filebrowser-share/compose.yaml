name: filebrowser-share

services:
  # Tailscale sidecar — gives this stack its OWN tailnet node ("fileshare") so the
  # public funnel can be scoped to that node alone. The existing services on
  # docker-host are a different node and stay tailnet-only.
  fileshare-ts:
    image: tailscale/tailscale:v1.102.4
    container_name: fileshare-ts
    hostname: fileshare
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ./ts-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    # On the shared proxy network so the gate can resolve `filebrowser` by name.
    networks:
      - proxy

  # The gate: shares the sidecar's network namespace, so it is the only thing the
  # funnel can reach. It forwards ONLY the Filebrowser public share surface to the
  # existing instance and 404s everything else (login, admin API, the tree).
  share-gate:
    image: caddy:2.11.4-alpine
    container_name: share-gate
    restart: unless-stopped
    network_mode: "service:fileshare-ts"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      fileshare-ts:
        condition: service_started

networks:
  proxy:
    external: true
