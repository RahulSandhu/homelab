[global]
   workgroup = WORKGROUP
   server string = docker-host music
   server min protocol = SMB2
   disable netbios = yes
   map to guest = bad user
   log file = /var/log/samba/log.%m

[music]
   path = /srv/music
   browseable = yes
   read only = no
   valid users = rahul
   force user = rahul
   force group = rahul
   create mask = 0644
   directory mask = 0755
   hosts allow = 192.168.1.0/24 100.64.0.0/10
   hosts deny = 0.0.0.0/0
