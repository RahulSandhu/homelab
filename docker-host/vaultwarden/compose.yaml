# Tailscale-only; do not expose publicly.

name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:1.37.3
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      # Escape $ as $$ in .env (Argon2 ADMIN_TOKEN).
      - .env
    volumes:
      - ./data:/data
    ports:
      # LAN, proxied by pve.
      - "8080:80"
