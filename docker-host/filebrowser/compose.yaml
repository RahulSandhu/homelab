name: filebrowser

services:
  filebrowser:
    # Maintained fork; the original is archived.
    image: gtstef/filebrowser:1.5.6-stable
    container_name: filebrowser
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      FILEBROWSER_CONFIG: /config/config.yaml
    volumes:
      # Read-only backup mirror.
      - /srv/backup:/srv:ro
      - ./config:/config
      - ./data:/home/filebrowser/data
    networks:
      - proxy

networks:
  proxy:
    external: true
