name: filebrowser-share

services:
  # Own tailnet node for the public funnel.
  fileshare-ts:
    image: tailscale/tailscale:v1.102.4
    container_name: fileshare-ts
    hostname: fileshare
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ./ts-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      - proxy

  # Only /files/public/* is exposed.
  share-gate:
    image: caddy:2.11.4-alpine
    container_name: share-gate
    restart: unless-stopped
    network_mode: "service:fileshare-ts"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      fileshare-ts:
        condition: service_started

networks:
  proxy:
    external: true
