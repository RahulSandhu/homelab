name: zipline

services:
  # Own tailnet node for the public funnel.
  zipline-ts:
    image: tailscale/tailscale:v1.102.4
    container_name: zipline-ts
    hostname: zipline
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ./ts-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      - internal

  zipline:
    image: ghcr.io/diced/zipline:4.8.0
    container_name: zipline
    restart: unless-stopped
    network_mode: "service:zipline-ts"
    depends_on:
      zipline-ts:
        condition: service_started
      postgresql:
        condition: service_healthy
    env_file: .env
    environment:
      CORE_HOSTNAME: 0.0.0.0
      CORE_PORT: 3000
      CORE_TRUST_PROXY: "true"
      CORE_TRUSTED_PROXIES: "127.0.0.1,::1"
      CORE_RETURN_HTTPS_URLS: "true"

      # Public instance: no signups.
      FEATURES_USER_REGISTRATION: "false"
      FEATURES_OAUTH_REGISTRATION: "false"
      FEATURES_DELETE_ON_MAX_VIEWS: "true"
      # Upload limits and expiry.
      FILES_MAX_FILE_SIZE: "1gb"
      FILES_MAX_FILES_PER_UPLOAD: "10"
      FILES_DEFAULT_EXPIRATION: "30d"
      # Serve HTML/JS as downloads.
      FILES_ASSUME_MIMETYPES: "true"
      FILES_DISABLED_TYPES: "text/html,application/javascript"
      FILES_DISABLED_TYPES_DEFAULT: "application/octet-stream"
      # Rate limit.
      RATELIMIT_ENABLED: "true"
      RATELIMIT_MAX: "10"
      RATELIMIT_WINDOW: "60"
      DATABASE_URL: postgresql://${POSTGRESQL_USER:-zipline}:${POSTGRESQL_PASSWORD}@postgresql:5432/${POSTGRESQL_DB:-zipline}
      DATASOURCE_TYPE: local
      DATASOURCE_LOCAL_DIRECTORY: /zipline/uploads
    volumes:
      - /srv/zipline/uploads:/zipline/uploads
      - /srv/zipline/public:/zipline/public
      - /srv/zipline/themes:/zipline/themes

  postgresql:
    image: postgres:16
    container_name: zipline-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER:-zipline}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:?POSTGRESQL_PASSWORD is required}
      POSTGRES_DB: ${POSTGRESQL_DB:-zipline}
    volumes:
      - /srv/zipline/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRESQL_USER:-zipline}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
