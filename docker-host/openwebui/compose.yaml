name: openwebui

services:
  # Tailscale sidecar — gives the chat UI its OWN tailnet node ("chat") so it is
  # reachable only inside the tailnet. Deliberately NOT funneled: the model is
  # private to the tailnet.
  openwebui-ts:
    image: tailscale/tailscale:v1.102.4
    container_name: openwebui-ts
    hostname: chat
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ./ts-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      - proxy

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.12.3
    container_name: openwebui
    restart: unless-stopped
    network_mode: "service:openwebui-ts"
    depends_on:
      openwebui-ts:
        condition: service_started
    environment:
      # Ollama runs on the PVE host (ministral-3:3b), not in this VM.
      # The sidecar is on the tailnet, so use the pve tailnet IP.
      OLLAMA_BASE_URL: http://100.117.51.55:11434
      WEBUI_URL: https://chat.tail91459b.ts.net
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      DEFAULT_MODELS: ministral-3:3b
      # First signup becomes the admin; set to "false" after creating it.
      ENABLE_SIGNUP: "true"
    volumes:
      - ./data:/app/backend/data

networks:
  proxy:
    external: true
