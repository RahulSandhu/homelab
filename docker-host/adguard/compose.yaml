name: adguard

services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: adguard
    restart: unless-stopped
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    ports:
      # DNS on the tailnet IP only.
      - "100.74.164.49:53:53/tcp"
      - "100.74.164.49:53:53/udp"
      # Admin UI localhost only (served on :8443).
      - "127.0.0.1:3000:3000"
